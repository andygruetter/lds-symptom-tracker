name: Security Review

on:
  pull_request:

jobs:
  security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-security-review@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
