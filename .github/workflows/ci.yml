name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      marketing-only: ${{ steps.filter.outputs.marketing-only }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - '!src/app/marketing/**'
              - '!src/components/marketing/**'
            config:
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - 'tsconfig.json'
              - 'tailwind.config.*'
              - 'postcss.config.*'
              - 'supabase/**'
              - '.github/workflows/**'
              - 'playwright.config.*'
              - 'vitest.config.*'
            marketing:
              - 'src/app/marketing/**'
              - 'src/components/marketing/**'
      # marketing-only: marketing changed, but no app code or config changed
      - id: set-output
        run: |
          if [[ "${{ steps.filter.outputs.marketing }}" == "true" && \
                "${{ steps.filter.outputs.app }}" == "false" && \
                "${{ steps.filter.outputs.config }}" == "false" ]]; then
            echo "marketing-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "marketing-only=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - name: Generate coverage report
        if: always()
        run: npx vitest run --coverage --coverage.thresholds.100=false 2>/dev/null || true
      - uses: codecov/codecov-action@v6
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Tests
    needs: [changes, lint-and-test, build]
    if: needs.changes.outputs.marketing-only != 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      INTERNAL_API_SECRET: ci-internal-api-secret
      BYPASS_AUTH: 'true'
      E2E_MOCK_EXTRACTION: 'true'
      E2E_MOCK_SUMMARY: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project="Desktop Chrome"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  migrate-preview:
    name: Migrate Preview DB
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [changes, lint-and-test, build]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref qxiuzpjxuqofkgdbdoau
      - run: supabase db push --linked
