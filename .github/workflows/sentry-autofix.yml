name: Sentry Autofix

on:
  issues:
    types: [opened]

jobs:
  label-sentry-issues:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, 'Sentry') || contains(github.event.issue.body, 'sentry.io')
    permissions:
      issues: write
    steps:
      - name: Add labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "sentry,claude"
